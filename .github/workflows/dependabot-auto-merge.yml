name: Dependabot auto-merge
on: pull_request_target

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ github.token }}
      - name: Skip non-patch updates
        if: ${{ steps.metadata.outputs.update-type != 'version-update:semver-patch' }}
        run: |
          echo "update-type=${{ steps.metadata.outputs.update-type }} のため自動マージをスキップします（patch のみ対象）"
      - name: Update PR branch if behind base
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-patch' }}
        run: gh pr update-branch "$PR_URL" 2>/dev/null || true
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check for merge conflicts
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-patch' }}
        run: |
          MERGEABLE=$(gh pr view "$PR_URL" --json mergeable --jq '.mergeable')
          echo "mergeable=$MERGEABLE"
          if [ "$MERGEABLE" = "CONFLICTING" ]; then
            echo "::error::コンフリクトが検出されました。@dependabot rebase をリクエストします。"
            gh pr comment "$PR_URL" --body "@dependabot rebase"
            exit 1
          fi
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Auto-merge (patch only)
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-patch' }}
        run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{ github.token }}
